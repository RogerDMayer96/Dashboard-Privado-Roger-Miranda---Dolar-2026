<!-- ══════════════════════════════════════════════════════════════════════
     GATE DE ACCESO: NOMBRE + CORREO AUTORIZADO (FormSubmit.co)
     El visitante ingresa nombre y correo. Si el correo no está en la lista
     autorizada, se envía un reporte SILENCIOSO (sin mailto ni borradores)
     vía formsubmit.co/ajax al destino indicado abajo, con el nombre y
     correo intentados. El acceso exitoso también se reporta en silencio.

     ⚠️ IMPORTANTE — leer antes de usar:
     1) Este archivo es HTML/JS estático (salida de flexdashboard); no hay
        servidor propio detrás. Este gate es un filtro de cortesía, NO
        seguridad real: cualquiera con la consola del navegador o viendo el
        código fuente puede saltárselo o encontrar el contenido igual. Para
        protección real el reporte debería estar detrás de un login de
        verdad (Netlify Basic Auth/Identity, una app Shiny con
        shinymanager, etc.).
     2) Los placeholders roger_miranda_@outlook.com y ["9c9f591d48f227e4b6572a7f97f1be73a42601ddf92b82002312234b8cd6e49a","547c8a07f438b1f06802ec4730731ab825ea259e3cd9f13104cbdd9e0b465d85"] son
        reemplazados por el chunk `setup-auth-gate` del RMD al renderizar.
        No edites este archivo para configurar correos: edita el RMD
        (destino_correo y correos_autorizados).
     3) FormSubmit.co: el primer envío desde un dominio/email nuevo requiere
        activación (FormSubmit envía un correo con un link de confirmación).
        Sin esa confirmación los reportes no llegarán.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
  html.ag-locked body {
    overflow: hidden !important;
  }
  #ag-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #0f172a;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
    color: #f8fafc;
  }
  .ag-card {
    background: #1e293b;
    padding: 2.5rem;
    border-radius: 12px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    max-width: 400px;
    width: 90%;
    text-align: center;
    border: 1px solid #334155;
  }
  .ag-card h2 {
    margin-top: 0;
    margin-bottom: 0.5rem;
    font-size: 1.5rem;
    color: #ffffff;
  }
  .ag-card p {
    font-size: 0.9rem;
    color: #94a3b8;
    margin-bottom: 1.5rem;
  }
  .ag-input-group {
    text-align: left;
    margin-bottom: 1rem;
  }
  .ag-input-group label {
    display: block;
    font-size: 0.8rem;
    color: #cbd5e1;
    margin-bottom: 0.3rem;
  }
  .ag-card input[type="text"],
  .ag-card input[type="email"] {
    width: 100%;
    padding: 0.75rem;
    border-radius: 6px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #ffffff;
    font-size: 1rem;
    box-sizing: border-box;
    outline: none;
  }
  .ag-card input:focus {
    border-color: #3b82f6;
  }
  .ag-card button {
    width: 100%;
    padding: 0.75rem;
    border-radius: 6px;
    border: none;
    background: #2563eb;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 0.5rem;
  }
  .ag-card button:hover {
    background: #1d4ed8;
  }
  .ag-card button:disabled {
    background: #475569;
    cursor: not-allowed;
  }
  .ag-error {
    color: #ef4444;
    font-size: 0.85rem;
    margin-top: 0.75rem;
    min-height: 1.2em;
  }
</style>

<div id="ag-overlay">
  <div class="ag-card">
    <div id="ag-step-form">
      <h2>Acceso Restringido</h2>
      <p>Por favor ingresa tus datos para acceder al contenido.</p>
      
      <div class="ag-input-group">
        <label for="ag-name-input">Nombre Completo</label>
        <input type="text" id="ag-name-input" placeholder="Ej. Juan Pérez" autocomplete="off" />
      </div>

      <div class="ag-input-group">
        <label for="ag-mail-input">Correo Electrónico</label>
        <input type="email" id="ag-mail-input" placeholder="ejemplo@correo.com" autocomplete="off" />
      </div>

      <button id="ag-submit-btn">Verificar e ingresar</button>
      <div id="ag-form-error" class="ag-error"></div>
    </div>
    
    <div id="ag-step-loading" style="display: none;">
      <h2>Validando...</h2>
      <p>Cargando información del panel.</p>
    </div>
  </div>
</div>

<script>
(function () {
  var DESTINO_FORMSUBMIT = "roger_miranda_@outlook.com";
  var CORREOS_AUTORIZADOS_HASH = ["9c9f591d48f227e4b6572a7f97f1be73a42601ddf92b82002312234b8cd6e49a","547c8a07f438b1f06802ec4730731ab825ea259e3cd9f13104cbdd9e0b465d85"];
  var SESSION_KEY = "ag_unlocked_v1";

  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    return;
  }

  document.documentElement.classList.add("ag-locked");

  function onReady(fn) {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", fn);
    } else { fn(); }
  }

  async function sha256Hex(texto) {
    var enc = new TextEncoder().encode(texto);
    var buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf))
      .map(function (b) { return b.toString(16).padStart(2, "0"); })
      .join("");
  }

  // Notificar intentos fallidos enviando tanto el nombre como el correo ingresados
  async function notificarIntentoFallido(tipoError, nombre, correo) {
    try {
      await fetch("https://formsubmit.co/ajax/" + DESTINO_FORMSUBMIT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          _subject: "⚠️ ALERTA: Intento de acceso no autorizado",
          _template: "table",
          "Tipo de error": tipoError,
          "Nombre completo": nombre,
          "Correo ingresado": correo,
          "Fecha y hora": new Date().toISOString(),
          "Página": window.location.href
        })
      });
    } catch (e) {
      console.warn("No se pudo enviar la alerta:", e);
    }
  }

  onReady(function () {
    var overlay   = document.getElementById("ag-overlay");
    var stepForm  = document.getElementById("ag-step-form");
    var stepLoad  = document.getElementById("ag-step-loading");

    var nameInput = document.getElementById("ag-name-input");
    var mailInput = document.getElementById("ag-mail-input");
    var submitBtn = document.getElementById("ag-submit-btn");
    var formErr   = document.getElementById("ag-form-error");

    function validEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    async function handleSubmit() {
      var nombre = (nameInput.value || "").trim();
      var correo = (mailInput.value || "").trim();

      if (!nombre) {
        formErr.textContent = "Por favor ingresa tu nombre completo.";
        return;
      }

      if (!validEmail(correo)) {
        formErr.textContent = "Ingresa un correo electrónico válido.";
        notificarIntentoFallido("Formato de correo inválido", nombre, correo);
        return;
      }

      submitBtn.disabled = true;
      formErr.textContent = "";

      var valNormalizado = correo.toLowerCase();
      var hashCorreo = await sha256Hex(valNormalizado);
      var autorizado = CORREOS_AUTORIZADOS_HASH.indexOf(hashCorreo) !== -1;

      if (!autorizado) {
        submitBtn.disabled = false;
        formErr.textContent = "Este correo no está autorizado para acceder.";
        // Envía reporte con Nombre + Correo no autorizado
        notificarIntentoFallido("Correo no autorizado", nombre, correo);
        return;
      }

      stepForm.style.display = "none";
      stepLoad.style.display = "block";

      sessionStorage.setItem(SESSION_KEY, "1");
      document.documentElement.classList.remove("ag-locked");
      overlay.remove();
    }

    submitBtn.addEventListener("click", handleSubmit);

    // Soporte para presionar Enter en los campos de texto
    nameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") mailInput.focus(); });
    mailInput.addEventListener("keydown", function (e) { if (e.key === "Enter") handleSubmit(); });

    nameInput.focus();
  });
})();
</script>
<!-- ══════════════════════════ FIN GATE DE ACCESO ══════════════════════════ -->

<script>
(function() {
  var pages = [
    { label: "📈 Cotización Bolivia",        href: "#cotizacion-bolivia" },
    { label: "📊 Otros Datos",               href: "#otros-datos" },
    { label: "🤖 Modelo Econométrico",        href: "#modelo-econometrico" },
    { label: "📅 Comportamiento por Mes",     href: "#comportamiento-por-mes" },
    { label: "🏦 Dólar Referencial BCB",      href: "#dolar-referencial-y-tipo-de-cambio-flexible-bcb" },
    { label: "💱 Bancos Comerciales",         href: "#bancos-comerciales" },
    { label: "🔬 Modelo Diario (Tentativo)",  href: "#modelo-diario-tentativo" }
  ];

  function buildSidebar() {
    var sidebar = document.createElement("nav");
    sidebar.id = "sb-nav";

    var title = document.createElement("div");
    title.id = "sb-title";
    title.textContent = "SECCIONES";
    sidebar.appendChild(title);

    var ul = document.createElement("ul");
    pages.forEach(function(p) {
      var li = document.createElement("li");
      var a  = document.createElement("a");
      a.href = p.href;
      a.textContent = p.label;
      a.addEventListener("click", function() {
        ul.querySelectorAll("a").forEach(function(x){ x.classList.remove("sb-active"); });
        a.classList.add("sb-active");
      });
      li.appendChild(a);
      ul.appendChild(li);
    });
    sidebar.appendChild(ul);
    document.body.appendChild(sidebar);

    // Marcar activo según hash
    function markActive() {
      var hash = window.location.hash || pages[0].href;
      ul.querySelectorAll("a").forEach(function(a) {
        a.classList.toggle("sb-active", a.getAttribute("href") === hash);
      });
    }
    window.addEventListener("hashchange", markActive);
    markActive();

    // Ocultar links de páginas en la navbar superior (dejar solo el título)
    function hideNavLinks() {
      var navLinks = document.querySelectorAll(".navbar-nav > li > a");
      navLinks.forEach(function(el) { el.parentElement.style.display = "none"; });
    }
    // Intentar varias veces hasta que el DOM esté listo
    var attempts = 0;
    var interval = setInterval(function() {
      hideNavLinks();
      attempts++;
      if (attempts > 10) clearInterval(interval);
    }, 100);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", buildSidebar);
  } else {
    buildSidebar();
  }
})();
</script>

<style>

/* ── Links ─────────────────────────────────────────────────────────────── */

/* ── Empujar todo el contenido 210px a la derecha ──────────────────────── */
body {
  padding-left: 210px !important;
}
.navbar {
  left: 210px !important;
  width: calc(100% - 210px) !important;
}

/* ── Ocultar los links de página en la navbar superior ─────────────────── */

/* ── Scrollbar del sidebar ─────────────────────────────────────────────── */

/* ── Responsive móvil: sidebar colapsable ──────────────────────────────── */
@media (max-width: 768px) {
  #sb-nav {
    width: 180px;
    transform: translateX(-180px);
    transition: transform 0.25s ease;
    z-index: 2100;
  }
  #sb-nav.sb-mobile-open {
    transform: translateX(0);
  }
  body { padding-left: 0 !important; }
  .navbar { left: 0 !important; width: 100% !important; }

  /* Botón hamburguesa solo en móvil */
  #sb-toggle {
    display: flex !important;
  }
  /* Overlay */
  #sb-overlay { display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 2090; }
  #sb-overlay.sb-show { display: block; }
}

/* Botón hamburguesa (oculto en desktop) */
#sb-toggle {
  display: none;
  position: fixed;
  top: 8px;
  left: 8px;
  z-index: 2200;
  background: #1ee29d;
  color: #0d1117;
  border: none;
  border-radius: 6px;
  width: 36px;
  height: 36px;
  font-size: 1.2rem;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(30,226,157,0.4);
}
</style>

<script>
// Lógica móvil: botón hamburguesa
(function() {
  function setupMobile() {
    var btn = document.createElement("button");
    btn.id = "sb-toggle";
    btn.innerHTML = "&#9776;";
    document.body.appendChild(btn);

    var overlay = document.createElement("div");
    overlay.id = "sb-overlay";
    document.body.appendChild(overlay);

    var sidebar = document.getElementById("sb-nav");
    btn.addEventListener("click", function() {
      sidebar.classList.toggle("sb-mobile-open");
      overlay.classList.toggle("sb-show");
    });
    overlay.addEventListener("click", function() {
      sidebar.classList.remove("sb-mobile-open");
      overlay.classList.remove("sb-show");
    });
    // Cerrar al seleccionar link en móvil
    sidebar.querySelectorAll("a").forEach(function(a) {
      a.addEventListener("click", function() {
        if (window.innerWidth <= 768) {
          sidebar.classList.remove("sb-mobile-open");
          overlay.classList.remove("sb-show");
        }
      });
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", setupMobile);
  } else {
    setupMobile();
  }
})();
</script>
